[project]
name = "cobot_gym"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
  "scipy>=1.11",
  "stable-baselines3>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["cobot_gym*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
